repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      # Type checking (runs before linting)
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, toml]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix]
      # Formatter
      - id: ruff-format

  - repo: local
    hooks:
      # Unit tests
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, toml]
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
