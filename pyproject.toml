[project]
name = "masters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julia Krempinska", email = "276043@student.pwr.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "tenacity>=9.0.0",
]

[project.scripts]
masters = "masters:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.22.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear (common bug patterns)
    "UP",   # pyupgrade (modern Python syntax)
    "C4",   # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
